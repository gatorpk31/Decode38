[build]
  command = "npm install"
  publish = "."
  functions = "netlify/functions"

# Security headers. CSP is intentionally omitted here — index.html ships a
# tuned <meta http-equiv> policy, and a second header policy would be enforced
# as an intersection and could break the Anthropic / Stripe endpoints.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Clean URL for admin page
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Privacy policy clean URL
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

# Route /api/* to Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
